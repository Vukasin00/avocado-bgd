    <!-- The kitchen's own manifest, in the HTML from the start: iOS Safari reads the manifest link when the page loads and
         ignores a later change by the app, so a dynamically swapped link made "Add to Home Screen" install the customer app. -->
    <link rel="manifest" href="/avocado-bgd/manifest-kuhinja.webmanifest" />
    <title>Kuhinja · Avocado</title>
    <style>
      /* Splash painted before the JS bundle arrives: the kitchen is dark, so the splash is too. */
      html, body, #root { height: 100%; margin: 0; }
      body { background: #172C0E; }
      .splash { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--color-cream-100, #fff); }
      .splash-name { font-family: var(--font-display, sans-serif); font-weight: var(--display-weight, 400); font-size: calc(40px * var(--display-scale, 1)); letter-spacing: var(--display-tracking, 0.02em); text-transform: var(--display-case, none); }
      .splash-sub { font: 600 12px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.55; }
    </style>
